name: build-debs

on:
  push:
    branches:
      - noetic
  workflow_dispatch:

jobs:
  cpp-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ quality gate
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ros:noetic-ros-base-focal \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                clang-format \
                clang-tidy \
                cppcheck \
                ros-noetic-gazebo-msgs \
                ros-noetic-geometry-msgs \
                ros-noetic-rostest \
                ros-noetic-rosunit \
                ros-noetic-tf2 \
                ros-noetic-tf2-ros \
                ros-noetic-vrpn \
                ros-noetic-vrpn-client-ros
              .xgc2/scripts/check_cpp_quality.sh
            '

  package-compliance-tests:
    needs: cpp-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace
        run: git diff --check HEAD

      - name: Check product version bump
        run: .xgc2/scripts/check_version_bump.sh --ci

      - name: Run package compliance and tests
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ros:noetic-ros-base-focal \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                git \
                netbase \
                ros-noetic-gazebo-msgs \
                ros-noetic-geometry-msgs \
                ros-noetic-rostest \
                ros-noetic-rosunit \
                ros-noetic-tf2 \
                ros-noetic-tf2-ros \
                ros-noetic-vrpn \
                ros-noetic-vrpn-client-ros
              git config --global --add safe.directory /work
              .xgc2/scripts/check_package_compliance.sh
              .xgc2/scripts/run_package_tests.sh
            '

  build:
    needs: package-compliance-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check product version bump
        run: .xgc2/scripts/check_version_bump.sh --ci

      - name: Build and install-check deb package in Docker
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/gazebo-sim-tools-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-gazebo-sim-tools-debs-${{ matrix.arch }}
          path: debs/*.deb

      - name: Publish to self-hosted APT repository
        if: ${{ env.APT_REPO_HOST != '' && env.APT_REPO_PORT != '' && env.APT_REPO_SSH_KEY != '' && env.APT_REPO_KNOWN_HOSTS != '' }}
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir debs
