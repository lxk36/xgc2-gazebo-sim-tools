name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Product version expected by the release orchestrator
        required: true
        type: string
      expected_source_sha:
        description: Source commit SHA expected by the release orchestrator
        required: true
        type: string
      publish_apt:
        description: Publish built debs to the XGC2 APT repository
        required: true
        default: false
        type: boolean
      run_cpp_quality:
        description: Run optional C++ quality checks before release
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run optional source tests before release
        required: true
        default: false
      release_id:
        description: Parent orchestrator run id used for correlation and audit.
        required: false
        default: ""
        type: string
      release_lock_digest:
        description: SHA256 of the immutable release lock.
        required: false
        default: ""
        type: string
      trusted_ci_run_id:
        description: Exact successful push CI run whose trusted deb artifacts may be reused
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-release-inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.product.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate expected version and source SHA
        id: product
        run: |
          set -euo pipefail
          version="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          if [[ -z "${version}" ]]; then
            echo "::error::missing version in .xgc2/product.yml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" != "${{ inputs.expected_version }}" ]]; then
            echo "::error::product.yml version ${version} does not match expected_version ${{ inputs.expected_version }}"
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          if [[ "${source_sha}" != "${{ inputs.expected_source_sha }}" ]]; then
            echo "::error::HEAD ${source_sha} does not match expected_source_sha ${{ inputs.expected_source_sha }}"
            exit 1
          fi

  release-checks:
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run release checks
        run: |
          set -euo pipefail
          git diff --check HEAD
          if [[ "${{ inputs.run_cpp_quality }}" != "true" && "${{ inputs.run_source_tests }}" != "true" ]]; then
            exit 0
          fi
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e RUN_CPP_QUALITY="${{ inputs.run_cpp_quality }}" \
            -e RUN_SOURCE_TESTS="${{ inputs.run_source_tests }}" \
            ros:noetic-ros-base-focal \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git
              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://xgc2.apt.xiaokang.ink/xgc2-archive-keyring.gpg \
                -o /etc/apt/keyrings/xgc2-archive-keyring.gpg
              chmod 0644 /etc/apt/keyrings/xgc2-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/xgc2-archive-keyring.gpg] https://xgc2.apt.xiaokang.ink focal main" \
                > /etc/apt/sources.list.d/xgc2.list
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                libxgc2-math-dev \
                netbase \
                ros-noetic-gazebo-msgs \
                ros-noetic-geometry-msgs \
                ros-noetic-mavros-msgs \
                ros-noetic-nav-msgs \
                ros-noetic-roslaunch \
                ros-noetic-rostest \
                ros-noetic-rosunit \
                ros-noetic-rospy \
                ros-noetic-tf2 \
                ros-noetic-tf2-ros \
                ros-noetic-vrpn \
                ros-noetic-vrpn-client-ros
              git config --global --add safe.directory /work
              if [[ "${RUN_CPP_QUALITY}" == "true" ]]; then
                .xgc2/scripts/check_cpp_quality.sh
                .xgc2/scripts/check_package_compliance.sh
              fi
              if [[ "${RUN_SOURCE_TESTS}" == "true" ]]; then
                .xgc2/scripts/run_package_tests.sh
              fi
            '

  build-debs:
    needs:
      - validate-release-inputs
      - release-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download trusted CI artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.trusted_ci_run_id }}
          name: xgc2-gazebo-sim-tools-debs-${{ matrix.arch }}
          path: .ci/trusted

      - name: Verify and stage trusted CI artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir .ci/trusted --deb-output-dir debs \
            --manifest-output-dir .ci/build-manifests \
            --product xgc2-gazebo-sim-tools --distribution focal \
            --architecture "${{ matrix.arch }}" --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "${{ inputs.trusted_ci_run_id }}"

      - name: Build and install-check deb packages
        if: ${{ inputs.trusted_ci_run_id == '' }}
        run: |
          install -d "$GITHUB_WORKSPACE/.ci/build-manifests"
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-gazebo-sim-tools-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create fallback build manifest
        if: ${{ inputs.trusted_ci_run_id == '' }}
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs --output-dir .ci/build-manifests \
            --product xgc2-gazebo-sim-tools --product-version "${{ inputs.expected_version }}" \
            --distribution focal --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-gazebo-sim-tools-release-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  publish-apt:
    if: ${{ inputs.publish_apt }}
    needs: build-debs
    runs-on: ubuntu-latest
    concurrency:
      group: xgc2-apt-focal
      cancel-in-progress: false
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xgc2-gazebo-sim-tools-release-debs-*
          path: release-input

      - name: Validate all architectures and create release manifests
        run: |
          for arch in amd64 arm64; do
            python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
              --artifact-dir release-input --deb-output-dir staged/debs \
              --manifest-output-dir staged/build-manifests \
              --product xgc2-gazebo-sim-tools --distribution focal \
              --architecture "$arch" --source-sha "${{ inputs.expected_source_sha }}"
          done
          python3 .xgc2/scripts/xgc2_artifact_manifest.py release \
            --deb-dir staged/debs --build-manifest-dir staged/build-manifests \
            --publish-dir publish --product xgc2-gazebo-sim-tools \
            --product-version "${{ inputs.expected_version }}" --distribution focal \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --release-id "${{ inputs.release_id || github.run_id }}" \
            --release-lock-digest "${{ inputs.release_lock_digest }}" \
            --target-architecture amd64 --target-architecture arm64

      - name: Publish to self-hosted APT repository
        run: |
          set -euo pipefail
          test -n "${APT_REPO_HOST}"
          test -n "${APT_REPO_SSH_KEY}"
          test -n "${APT_REPO_KNOWN_HOSTS}"
          export APT_REPO_PORT="${APT_REPO_PORT:-22}"
          .xgc2/scripts/publish_apt_repo.sh --deb-dir publish
