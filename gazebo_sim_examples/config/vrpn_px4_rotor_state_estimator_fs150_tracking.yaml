imu_topic: mavros/imu/data_raw
vrpn_pose_topic: /vrpn_client_node/uav1/pose
state_topic: alg/state_estimator/state
vision_pose_topic: mavros/vision_pose/pose

loop_rate_hz: 1000.0
state_publish_rate_hz: 100.0
vision_publish_rate_hz: 30.0

gravity_mps2: 9.8066
field_offset_xyz: [0.0, 0.0, 0.0]
field_offset_rpy: [0.0, 0.0, 0.0]
imu_to_vrpn_marker_xyz: [0.0, 0.0, 0.0]
imu_to_vrpn_marker_rpy: [0.0, 0.0, 0.0]
extrinsic_verified: true
estimate_extrinsic: false

imu_timeout_s: 0.05
vrpn_timeout_s: 0.12
coasting_timeout_s: 0.5
min_imu_rate_hz: 25.0
min_vrpn_rate_hz: 20.0
max_time_jump_s: 0.25

accel_noise_std: 0.35
gyro_noise_std: 0.03
vrpn_position_noise_std: 0.01
vrpn_orientation_noise_std: 0.01
gyro_bias_random_walk_std: 0.0001
accel_bias_random_walk_std: 0.001
extrinsic_position_random_walk_std: 0.00001
extrinsic_orientation_random_walk_std: 0.00001
innovation_position_gate_m: 1.5
innovation_orientation_gate_rad: 0.8
covariance_high_threshold: 100.0
max_propagation_dt_s: 0.05
initial_position_variance: 0.01
initial_velocity_variance: 0.1
initial_orientation_variance: 0.01
initial_gyro_bias_variance: 0.01
initial_accel_bias_variance: 0.1
