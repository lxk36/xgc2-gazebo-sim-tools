schema: xgc2.product.v1
id: xgc2-gazebo-sim-tools
name: XGC2 Gazebo Sim Tools
version: 1.1.0-7
kind: ros1-apt
summary: Gazebo Classic session manager and example launch orchestration packages
  for ROS Noetic.
ros:
  distro: noetic
  packages:
  - gazebo_session_manager
  - gazebo_sim_examples
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-gazebo-sim-manager
  - ros-noetic-xgc2-gazebo-sim-examples
  packages:
  - ros-noetic-xgc2-gazebo-sim-manager
  - ros-noetic-xgc2-gazebo-sim-examples
  depends:
  - ros-noetic-vrpn-client-ros
  - ros-noetic-rviz
  - ros-noetic-robot-state-publisher
  - ros-noetic-xgc2-gazebo-sim-visualization (>= 1.1.0-6)
  - ros-noetic-xgc2-gazebo-sim-vrpn-bridge (>= 1.1.0-6)
  - ros-noetic-xgc2-gazebo-sim-fs150-sitl
  - ros-noetic-xgc2-gazebo-sim-scout
  - ros-noetic-xgc2-gazebo-sim-worlds (>= 1.1.0-7)
  - ros-noetic-xgc2-multirotor-controller (>= 1.1.15-6)
  - ros-noetic-xgc2-ugv-controller (>= 1.1.1-6)
  - ros-noetic-xgc2-estimator-hover-thrust (>= 1.1.22-6)
  - ros-noetic-xgc2-estimator-rigid-state (>= 1.1.3-6)
  - libxgc2-math-dev (>= 0.5.5-5)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-gazebo-sim-manager ros-noetic-xgc2-gazebo-sim-examples

    '
  smoke_test: 'roslaunch --files gazebo_session_manager session_manager.launch world_name:=/tmp/xgc2-empty.world

    roslaunch --files gazebo_sim_examples fs150_ugv_vrpn_stack.launch

    roslaunch --files gazebo_sim_examples fs150_uav1_nmpc_tracking.launch

    roslaunch --files gazebo_sim_visualization gazebo_auto_visualization_rviz.launch
    rviz:=false

    roslaunch --files gazebo_sim_vrpn_bridge vrpn_server.launch auto_track_known_models:=true

    roslaunch --files gazebo_sim_vrpn_bridge vrpn_client.launch trackers:=[uav1]

    '
  notes: 'These are Gazebo Classic simulation tools. The full suite is installed through
    ros-noetic-xgc2-gazebo-sim-all from xgc2-gazebo-sim.

    '
ownership:
  paths:
  - /opt/ros/noetic/share/gazebo_session_manager
  - /opt/ros/noetic/lib/gazebo_session_manager
  - /opt/ros/noetic/share/gazebo_sim_examples
  - /opt/ros/noetic/lib/gazebo_sim_examples
