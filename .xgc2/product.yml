schema: xgc2.product.v1
id: xgc2-gazebo-sim-tools
name: XGC2 Gazebo Sim Tools
version: 1.1.0-30
kind: ros1-apt
summary: Legacy Gazebo Classic example launch orchestration retained during the
  XGC2 ground-station migration.
ros:
  distro: noetic
  packages:
  - gazebo_sim_examples
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-gazebo-sim-examples
  packages:
  - ros-noetic-xgc2-gazebo-sim-examples
  depends:
  - ros-noetic-vrpn-client-ros
  - ros-noetic-rviz
  - ros-noetic-robot-state-publisher
  - ros-noetic-xgc2-gazebo-sim-visualization (>= 1.1.0-12)
  - ros-noetic-xgc2-gazebo-sim-vrpn-bridge (>= 1.1.0-13)
  - ros-noetic-xgc2-gazebo-sim-fs150-sitl (>= 1.1.0-12)
  - ros-noetic-xgc2-gazebo-sim-scout (>= 0.4.9-25)
  - ros-noetic-xgc2-gazebo-sim-worlds (>= 1.1.0-14)
  - ros-noetic-xgc2-multirotor-controller (>= 1.1.18-4)
  - ros-noetic-xgc2-px4-multirotor-controller-msgs (>= 1.2.0-3)
  - ros-noetic-xgc2-ugv-controller (>= 1.1.4-9)
  - ros-noetic-xgc2-estimator-hover-thrust (>= 1.1.24-6)
  - ros-noetic-xgc2-estimator-rigid-state (>= 1.1.6-6)
  - ros-noetic-xgc2-estimator-rigid-state-msgs (>= 1.2.0-3)
  - ros-noetic-std-msgs
  - xgc2-vrpn-router (>= 0.1.0-4+focal)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-gazebo-sim-examples

    '
  smoke_test: 'roslaunch --files gazebo_sim_examples fs150_ugv_vrpn_stack.launch

    roslaunch --files gazebo_sim_examples fs150_uav1_nmpc_tracking.launch

    rosrun gazebo_sim_examples uav_auto_takeoff_track.py --help

    roslaunch --files gazebo_sim_visualization gazebo_auto_visualization_rviz.launch
    rviz:=false

    roslaunch --files gazebo_sim_vrpn_bridge vrpn_server.launch auto_track_known_models:=true

    roslaunch --files gazebo_sim_vrpn_bridge vrpn_client.launch trackers:=[uav1]

    '
  notes: 'These Gazebo Classic examples are retained temporarily while launch orchestration
    migrates into XGC2 ground-station Automations. The retired standalone session manager
    is intentionally not packaged.

    '
ownership:
  paths:
  - /opt/ros/noetic/share/gazebo_sim_examples
  - /opt/ros/noetic/lib/gazebo_sim_examples
release:
  requires:
  - xgc2-gazebo-sim-scout
  - xgc2-px4-sitl-112
  - libxgc2-math-dev
