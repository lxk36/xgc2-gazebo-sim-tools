schema: xgc2.product.v1
id: xgc2-gazebo-sim-tools
name: XGC2 Gazebo Sim Tools
version: 1.1.0-33
kind: ros1-apt
summary: Gazebo Classic scene SystemPlugin and legacy example launch orchestration
  retained during the XGC2 ground-station migration.
ros:
  distro: noetic
  packages:
  - gazebo_sim_examples
  - xgc2_gazebo_scene
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-gazebo-sim-examples
  packages:
  - ros-noetic-xgc2-gazebo-sim-examples
  - ros-noetic-xgc2-gazebo-scene
  depends:
  - ros-noetic-gazebo-ros
  - ros-noetic-geometry-msgs
  - ros-noetic-message-runtime
  - ros-noetic-rosconsole
  - ros-noetic-roscpp
  - ros-noetic-roscpp-serialization
  - ros-noetic-rostime
  - ros-noetic-vrpn-client-ros
  - ros-noetic-rviz
  - ros-noetic-robot-state-publisher
  - ros-noetic-std-msgs
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-gazebo-sim-examples

    '
  smoke_test: 'test -f /opt/ros/noetic/share/gazebo_sim_examples/launch/fs150_ugv_vrpn_stack.launch

    test -f /opt/ros/noetic/lib/libxgc2_gazebo_scene_system.so

    '
  notes: 'gazebo_sim_examples is a retired, asset-only compatibility package. XGC2
    Automations replace its launch aggregation. It does not publish process definitions
    and its historical launch files and scripts are deliberately not executed during
    release. The scene package remains a separately verified compiled runtime.

    '
ownership:
  paths:
  - /opt/ros/noetic/share/gazebo_sim_examples
  - /opt/ros/noetic/lib/gazebo_sim_examples
  - /opt/ros/noetic/share/xgc2_gazebo_scene
  - /opt/ros/noetic/include/xgc2_gazebo_scene
  - /opt/ros/noetic/lib/libxgc2_gazebo_scene_motion.so
  - /opt/ros/noetic/lib/libxgc2_gazebo_scene_system.so
  - /opt/ros/noetic/lib/pkgconfig/xgc2_gazebo_scene.pc
  - /opt/ros/noetic/lib/python3/dist-packages/xgc2_gazebo_scene
  - /opt/ros/noetic/share/common-lisp/ros/xgc2_gazebo_scene
  - /opt/ros/noetic/share/gennodejs/ros/xgc2_gazebo_scene
  - /opt/ros/noetic/share/roseus/ros/xgc2_gazebo_scene
release:
  dependency_policy: {}
